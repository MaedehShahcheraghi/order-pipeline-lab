services:
  order-dev:
    profiles: ["dev"]
    image: ${IMAGE_REPOSITORY:-ghcr.io/maedehshahcheraghi/order-pipeline-lab}:${DEV_TAG:-0.1.0-dev.1}
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=32m"]
  order-staging:
    profiles: ["staging"]
    image: ${IMAGE_REPOSITORY:-ghcr.io/maedehshahcheraghi/order-pipeline-lab}:${STAGING_TAG:-0.1.0-rc.1}
    ports: ["127.0.0.1:8082:8080"]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=32m"]
  order-prod:
    profiles: ["prod"]
    image: ${IMAGE_REPOSITORY:-ghcr.io/maedehshahcheraghi/order-pipeline-lab}:${PROD_TAG:-0.1.0}
    ports: ["127.0.0.1:8083:8080"]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=32m"]
