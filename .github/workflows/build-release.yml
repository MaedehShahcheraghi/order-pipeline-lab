name: Version, Build and Publish

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: release-tags-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/'))) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Fetch all Git tags
        run: git fetch --force --tags origin
      - name: Select versioning mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "kind=stable" >> "$GITHUB_OUTPUT"
            echo "branch=$PR_HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          elif [[ "$CURRENT_BRANCH" == "develop" ]]; then
            echo "kind=dev" >> "$GITHUB_OUTPUT"
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          elif [[ "$CURRENT_BRANCH" == release/* ]]; then
            echo "kind=rc" >> "$GITHUB_OUTPUT"
            echo "branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported publish event / branch: $CURRENT_BRANCH" >&2
            exit 1
          fi
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and test BEFORE publishing
        run: |
          dotnet restore OrderPipelineLab.sln
          dotnet test tests/OrderPipeline.UnitTests/OrderPipeline.UnitTests.csproj -c Release --no-restore
          python3 -m unittest discover -s build/tests -p 'test_*.py' -v
      - name: Compute version from Git history
        id: version
        env:
          KIND: ${{ steps.mode.outputs.kind }}
          BRANCH: ${{ steps.mode.outputs.branch }}
        run: |
          python3 build/versioning.py --kind "$KIND" --branch "$BRANCH" --sha "$(git rev-parse HEAD)"
      - name: Compute lowercase container repository
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.repo.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.repo.outputs.image }}:sha-${{ steps.version.outputs.short_sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
      - name: Create and push IMMUTABLE Git tag after successful image push
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Published $TAG"
          git push origin "refs/tags/$TAG"
      - name: Show published artifact
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Git tag: ${{ steps.version.outputs.tag }}"
          echo "Commit: ${{ steps.version.outputs.sha }}"
          echo "Image: ${{ steps.repo.outputs.image }}:${{ steps.version.outputs.version }}"
