name: Unit Tests

on:
  pull_request:
    branches: [main, develop, 'release/**', 'hotfix/**']
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PR policy
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 build/validate_pr.py
      - name: Verify main PR uses exact tested RC tree
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/tags/*:refs/tags/*'
          python3 build/release_guard.py pre-merge --head-ref "$PR_HEAD_REF" --head-sha "$PR_HEAD_SHA"
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OrderPipelineLab.sln
      - name: Build
        run: dotnet build OrderPipelineLab.sln -c Release --no-restore
      - name: Test (xUnit)
        run: dotnet test tests/OrderPipeline.UnitTests/OrderPipeline.UnitTests.csproj -c Release --no-build --logger 'trx;LogFileName=unit-tests.trx'
      - name: Test version calculator
        run: python3 -m unittest discover -s build/tests -p 'test_*.py' -v
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ github.run_id }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 7
